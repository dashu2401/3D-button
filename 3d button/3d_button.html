<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neumorphism Button</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#101010;
            font-family:Arial, Helvetica, sans-serif;
        }

        .neumorph{
            width:200px;
            height:200px;
            border-radius:50px;
            background:#2a2d38;
            color:#ffffff;
            font-size:1.5rem;
            font-weight:bold;
            letter-spacing:2px;
            cursor:pointer;
            user-select:none;

            display:flex;
            justify-content:center;
            align-items:center;

            /* 3D Raised Effect */
            box-shadow:
                10px 10px 20px #16171d,
                -10px -10px 20px #3a3d4b;

            transition:0.2s ease-in-out;
        }

        /* Hover Effect */
        .neumorph:hover{
            transform:translateY(-5px);
            box-shadow:
                15px 15px 25px #16171d,
                -15px -15px 25px #3a3d4b;
        }

        /* Press Effect */
        .neumorph:active{
            transform:scale(0.96);

            box-shadow:
                inset 8px 8px 16px #16171d,
                inset -8px -8px 16px #3a3d4b;
        }
    </style>
</head>

<body>

    <div class="neumorph">
        Press Me
    </div>

</body>
</html>
